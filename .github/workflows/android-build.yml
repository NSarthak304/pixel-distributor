name: Android APK Compilation & CI/CD Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Verify Tests & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite (50+ Unit & Integration Tests)
        run: npm test

      - name: Compile All Web & PWA Bundles
        run: npm run build:all

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Release APK
        working-directory: apps/android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease --no-daemon

      - name: Compute SHA-256 Checksum
        working-directory: apps/android
        run: |
          sha256sum app/build/outputs/apk/release/*.apk > checksum.txt
          cat checksum.txt

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-distributor-release-apk
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/checksum.txt
          retention-days: 30
